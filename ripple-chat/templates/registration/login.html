{% extends "base.html" %}
{% block title %}Log in · Ripple-Chat{% endblock %}
{% block content %}
<div class="card">
  <h1>Log in</h1>
  <form method="post">
    {% csrf_token %}{{ form.as_p }}
    <input type="hidden" name="next" value="{{ next }}">
    <button type="submit" class="btn">Log in</button>
  </form>
  <p class="muted">New here? <a href="{% url 'signup' %}">Join Ripple</a></p>
</div>
{% endblock %}
