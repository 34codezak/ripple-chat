{% extends "base.html" %}
{% block title %}Join Ripple · Ripple-Chat{% endblock %}
{% block content %}
<div class="card">
  <h1>Join Ripple</h1>
  <form method="post">
    {% csrf_token %}{{ form.as_p }}
    <button type="submit" class="btn">Create account</button>
  </form>
  <p class="muted">Already registered? <a href="{% url 'login' %}">Log in</a></p>
</div>
{% endblock %}
